<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maskara</title>
<meta name="description" content="maskara swaps every person in tables and free text for a consistent synthetic persona, and measures that the data stayed useful.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M1 12h21.5M1 10.75h5v2.5H1zM9 6.5v11M12 4.5v15M15 5v14M18 6.5v11M21 9v6' fill='none' stroke='%230a0a0a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>/* maskara report and local UI: the tokens and type of maskara.dev (web/src/app/(site)/site.css), black
   and white, with system fonts so nothing is fetched. Shared by report.html and the UI. */

:root, [data-theme="light"] {
  --bg: #ffffff; --bg2: #fafafa; --card: #ffffff;
  --ink: #0a0a0a; --dim: #525252; --faint: #8f8f8f;
  --line: #ebebeb; --line2: #dcdcdc; --fill: #f2f2f2; --dot: #d4d4d4;
  --good: #0a0a0a; --warn: #a15c00; --bad: #c0261f;
  --shadow: 0 1px 2px rgb(0 0 0 / 4%), 0 12px 32px -12px rgb(0 0 0 / 12%);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --bg2: #111111; --card: #111111;
    --ink: #ededed; --dim: #a1a1a1; --faint: #6f6f6f;
    --line: #1f1f1f; --line2: #2e2e2e; --fill: #1a1a1a; --dot: #262626;
    --good: #ededed; --warn: #e0a040; --bad: #ff6b5e;
    --shadow: 0 0 0 1px rgb(255 255 255 / 4%), 0 16px 40px -16px rgb(0 0 0 / 60%);
    color-scheme: dark;
  }
}
[data-theme="dark"] {
  --bg: #0a0a0a; --bg2: #111111; --card: #111111;
  --ink: #ededed; --dim: #a1a1a1; --faint: #6f6f6f;
  --line: #1f1f1f; --line2: #2e2e2e; --fill: #1a1a1a; --dot: #262626;
  --good: #ededed; --warn: #e0a040; --bad: #ff6b5e;
  --shadow: 0 0 0 1px rgb(255 255 255 / 4%), 0 16px 40px -16px rgb(0 0 0 / 60%);
  color-scheme: dark;
}

.rp { color: var(--ink); font: 14.5px/1.6 var(--sans); }
.rp h2 { margin: 48px 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -.035em; line-height: 1.15; }
.rp h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.rp .kicker { margin: 0 0 10px; color: var(--faint); font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.rp .lead { margin: 0 0 20px; color: var(--dim); max-width: 720px; }
.rp code, .rp .mono { font-family: var(--mono); font-size: .92em; }

/* headline tiles */
.rp .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.rp .tile { padding: 20px 20px 18px; border-left: 1px solid var(--line); margin-left: -1px; }
.rp .tile b { display: block; font-size: 36px; font-weight: 600; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.rp .tile b small { font-size: 15px; font-weight: 500; letter-spacing: -.01em; color: var(--faint); margin-left: 4px; }
.rp .tile span { display: block; margin-top: 8px; color: var(--dim); font-size: 13px; line-height: 1.45; }
.rp .tile.bad b { color: var(--bad); }
.rp .tile.warn b { color: var(--warn); }

/* metric cards */
.rp .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.rp .card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 18px 20px; min-width: 0; }
.rp .card.wide { grid-column: 1 / -1; }
.rp .card-hd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.rp .card-hd .val { margin-left: auto; font: 600 20px var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp .val.bad { color: var(--bad); }
.rp .val.warn { color: var(--warn); }
.rp table.kv { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rp table.kv td, .rp table.kv th { padding: 6px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.rp table.kv th { color: var(--faint); font: 500 11.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; border-top: 0; }
.rp table.kv td + td, .rp table.kv th + th { padding-left: 12px; }
.rp table.kv .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp .scope { margin: 12px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--line2); color: var(--faint); font-size: 12.5px; line-height: 1.5; }
.rp .scope p { margin: 0; }
.rp .scope p + p { margin-top: 4px; }
.rp .scope b { color: var(--dim); font-weight: 500; }
.rp .bar { position: relative; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; min-width: 60px; }
.rp .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 3px; }
.rp ul.blind { margin: 0; padding: 0; list-style: none; border: 1px dashed var(--line2); border-radius: 12px; }
.rp ul.blind li { padding: 12px 18px; color: var(--dim); border-top: 1px dashed var(--line2); }
.rp ul.blind li:first-child { border-top: 0; }
.rp .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rp .chip { padding: 1px 9px; border: 1px solid var(--line2); border-radius: 999px; color: var(--dim); font: 12px var(--mono); white-space: nowrap; }
.rp .chip b { color: var(--ink); font-weight: 500; }

/* maskara UI. Loaded after report/report.css, whose tokens it uses: maskara.dev's black and white,
   with one tint per category for replaced values. No fonts or images are fetched. */

* , *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--ink); color: var(--bg); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
.boot { padding: 48px; color: var(--faint); font-family: var(--mono); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

.c-PERSON { --c: #7c5cff; } .c-CONTACT { --c: #2b7fd8; } .c-ADDRESS { --c: #13a17a; } .c-LOCATION { --c: #5c9e1f; }
.c-DATE { --c: #d08300; } .c-ID { --c: #8a8a8a; } .c-FINANCIAL { --c: #e0552b; } .c-DEMOGRAPHIC { --c: #c548a8; }
.c-CREDENTIAL { --c: #e0245e; } .c-NETWORK { --c: #0f9bb0; } .c-ORG { --c: #9a7a40; } .c-OTHER { --c: #8f8f8f; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); }
.top .wrap { display: flex; align-items: center; gap: 18px; height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.brand svg { width: 22px; height: 22px; }
.brand b { font-size: 17px; font-weight: 600; letter-spacing: -.03em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 6px 12px; border-radius: 999px; color: var(--dim); text-decoration: none; font-size: 14px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--fill); }
.tabs a[aria-current="page"] { color: var(--bg); background: var(--ink); }
.top-end { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.badge { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border: 1px solid var(--line2);
  border-radius: 999px; color: var(--dim); font: 12px var(--mono); white-space: nowrap; }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0;
  border: 1px solid var(--line2); border-radius: 999px; background: none; color: var(--dim); cursor: pointer; }
.icon-btn:hover { color: var(--ink); background: var(--fill); }
.icon-btn svg { width: 15px; height: 15px; }

/* showroom banner */
.banner { border-bottom: 1px solid var(--line); background: var(--bg2); }
.banner .wrap { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; font-size: 13.5px; color: var(--dim); }
.banner strong { color: var(--ink); font-weight: 600; }
.banner .links { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px;
  border: 1px solid transparent; font-size: 13.5px; font-weight: 500; text-decoration: none; white-space: nowrap; cursor: pointer; background: none; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { opacity: .86; }
.btn-primary:disabled { opacity: .5; cursor: progress; }
.btn-secondary { border-color: var(--line2); color: var(--ink); background: var(--bg); }
.btn-secondary:hover { background: var(--fill); }
.cmd { display: inline-flex; align-items: center; height: 34px; max-width: 100%; border: 1px solid var(--line2); border-radius: 999px; background: var(--bg); overflow: hidden; }
.cmd code { padding: 0 4px 0 14px; font: 12.5px var(--mono); color: var(--dim); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.cmd code b { color: var(--faint); font-weight: 400; margin-right: 8px; }
.cmd button { align-self: stretch; padding: 0 12px 0 8px; border: 0; background: none; cursor: pointer; color: var(--faint); font: 500 12px var(--sans); }
.cmd button:hover { color: var(--ink); }

/* page head */
main { padding: 40px 0 96px; }
.page-hd { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 26px; }
.page-hd > div { flex: 1 1 520px; min-width: 0; }
.kicker { margin: 0 0 10px; color: var(--faint); font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -.045em; line-height: 1.05; text-wrap: balance; }
h1 span { color: var(--faint); }
.sub { margin: 12px 0 0; color: var(--dim); font-size: 15.5px; max-width: 760px; text-wrap: pretty; }
h2.sec { margin: 44px 0 14px; font-size: 22px; font-weight: 600; letter-spacing: -.03em; }
.notice { margin: 0 0 18px; padding: 10px 14px; border: 1px dashed var(--line2); border-radius: 10px; color: var(--dim); font-size: 13.5px; }

/* pills, chips, legend */
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.pills a { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px; border: 1px solid var(--line2); border-radius: 999px;
  color: var(--dim); text-decoration: none; font-size: 13.5px; }
.pills a:hover { color: var(--ink); background: var(--fill); }
.pills a[aria-current="page"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.pills a small { font: 11.5px var(--mono); opacity: .7; }
.role { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border: 1px solid var(--line2); border-radius: 999px;
  color: var(--faint); font: 400 11px/18px var(--mono); white-space: nowrap; }
.role[class*="c-"]::before, .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; color: var(--faint); font: 12px var(--mono); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--dim); font-weight: 500; }
.toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .legend { margin-left: auto; }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13.5px; cursor: pointer; user-select: none; }
.switch input { accent-color: var(--ink); }

/* highlighted values */
mark.hl { color: inherit; background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: inset 0 -1.5px 0 var(--c);
  border-radius: 3px; padding: 0 1px; cursor: default; transition: background-color .12s ease, box-shadow .12s ease; }
mark.hl.before { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--c) 75%, transparent); color: var(--dim); }
mark.hl.kept { background: none; box-shadow: inset 0 -1.5px 0 color-mix(in srgb, var(--c) 55%, transparent); text-decoration: none; }
mark.hl.hot { background: color-mix(in srgb, var(--c) 32%, transparent); box-shadow: inset 0 0 0 1.5px var(--c); }

/* table viewer */
.scroll { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); max-height: calc(100vh - 230px); }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13px; }
.grid th, .grid td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
.grid thead th { position: sticky; top: 0; z-index: 1; background: var(--bg2); font-weight: 500; }
.grid thead th div { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.grid th.n, .grid td.n { position: sticky; left: 0; background: var(--bg2); color: var(--faint); font: 11.5px var(--mono); text-align: right; }
.grid thead th.n { z-index: 2; }
.grid td.rep { padding-top: 5px; padding-bottom: 5px; }
.grid td .was { display: block; color: var(--faint); font-size: 11.5px; text-decoration: line-through; text-decoration-color: var(--line2); }
.grid td .now { border-radius: 3px; padding: 0 3px; margin: 0 -3px; background: color-mix(in srgb, var(--c) 13%, transparent); box-shadow: inset 0 -1.5px 0 var(--c); }
.grid td .now.kept { background: none; box-shadow: inset 0 -1.5px 0 color-mix(in srgb, var(--c) 50%, transparent); }
.grid td.txt { max-width: 360px; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.grid td.txt a { margin-right: 8px; color: var(--ink); font: 500 11.5px var(--mono); text-decoration: none; border-bottom: 1px solid var(--line2); }
.grid tr:hover td:not(.n) { background: var(--bg2); }
.more { display: flex; justify-content: center; padding: 14px; }

/* text viewer */
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.list { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.list input { width: 100%; height: 40px; padding: 0 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--bg2); outline: none; font-size: 13.5px; }
.list a { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line); text-decoration: none; }
.list a:hover { background: var(--bg2); }
.list a[aria-current="page"] { background: var(--fill); box-shadow: inset 2px 0 0 var(--ink); }
.list a b { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; }
.list a b small { color: var(--faint); font: 11.5px var(--mono); }
.list a span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); font-size: 12.5px; }
.panes { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.panes.one { grid-template-columns: 1fr; }
.pane { min-width: 0; padding: 16px 20px 20px; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--faint); font: 12px var(--mono); }
.pane-hd b { padding: 1px 10px; border: 1px solid var(--line2); border-radius: 999px; color: var(--dim); font-weight: 500; }
.pane-hd .state { margin-left: auto; }
.prose { margin: 0; white-space: pre-wrap; word-wrap: break-word; font: 13px/1.75 var(--mono); color: var(--dim); }
.after .prose { color: var(--ink); }
.text-hd { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.text-hd h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.text-hd .legend { margin-left: auto; }

/* audit rows */
table.audit { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
.audit th, .audit td { padding: 7px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.audit th { border-top: 0; color: var(--faint); font: 500 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.audit td.mono { font: 12px var(--mono); color: var(--dim); }
.audit s { color: var(--faint); text-decoration-color: var(--line2); }
.audit a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line2); }

/* overview */
.inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.inp { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-decoration: none; transition: border-color .15s ease, box-shadow .15s ease; }
.inp:hover { border-color: var(--line2); box-shadow: var(--shadow); }
.inp h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.inp h3 small { color: var(--faint); font: 12px var(--mono); font-weight: 400; }
.inp p { margin: 0 0 10px; color: var(--dim); font-size: 13px; }
.inp .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

/* personas */
.who { display: flex; align-items: center; gap: 12px; }
.avatar { display: grid; place-items: center; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--fill); color: var(--dim); font: 600 12.5px var(--sans); letter-spacing: -.02em; }
.avatar.big { width: 64px; height: 64px; font-size: 22px; }
.pcard { padding: 22px 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.pcard h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.04em; line-height: 1.1; }
.pcard .was { display: block; margin-top: 4px; color: var(--faint); font-size: 13px; }
.pcard .was s { text-decoration-color: var(--line2); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 18px; margin: 18px 0 0; }
.facts div { padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.facts dt { color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.facts dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.where { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.person-link { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-decoration: none; }
.person-link:hover { border-color: var(--line2); box-shadow: var(--shadow); }
.person-link b { display: block; font-size: 14px; font-weight: 600; }
.person-link small { display: block; color: var(--faint); font: 11.5px var(--mono); }

/* run form */
.form { display: grid; gap: 18px; max-width: 920px; }
.form fieldset { margin: 0; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.form legend { padding: 0 6px; color: var(--faint); font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.form .row { display: grid; grid-template-columns: 110px 150px minmax(0, 1fr) 150px 34px; gap: 8px; margin-bottom: 8px; }
.form input, .form select { height: 36px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); outline: none; min-width: 0; }
.form input:focus, .form select:focus { border-color: var(--ink); }
.form .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.form label { display: grid; gap: 4px; color: var(--dim); font-size: 13px; }
.form .hint { margin: 6px 0 0; color: var(--faint); font-size: 12.5px; }
.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 13.5px; white-space: pre-wrap; }
.status { color: var(--faint); font: 12.5px var(--mono); }
.empty { padding: 56px 24px; text-align: center; border: 1px dashed var(--line2); border-radius: 12px; color: var(--dim); }
.empty h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.03em; color: var(--ink); }

/* hover card */
.tip { position: fixed; z-index: 50; max-width: 320px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px;
  background: var(--card); box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.5; pointer-events: none; }
.tip b { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 6px 0 0; }
.tip dt { color: var(--faint); font: 11px/1.7 var(--mono); }
.tip dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }

}

003c/td>\u003ctd class=\"\">KS\u003c/td>\u003ctd class=\"\">\u003cdiv class=\"bar\">\u003ci style=\"width:3.8%\">\u003c/i>\u003c/div>\u003c/td>\u003ctd class=\"num\">0.038\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"scope\">\u003cp>\u003cb>Measured:\u003c/b> per table column, the distance between the original and masked value distributions: total variation (TVD) for categories, Kolmogorov-Smirnov (KS) for numbers, dates (by day) and birth dates (by year); 0 is identical, 1 disjoint\u003c/p>\u003cp>\u003cb>Not measured:\u003c/b> joint distributions across columns; columns of unique keys and free text (names, emails, ids), where a distribution distance means nothing\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"card \">\u003cdiv class=\"card-hd\">\u003ch3>Placeholders and over-masking\u003c/h3>\u003cspan class=\"val \">0.0%\u003c/span>\u003c/div>\u003ctable class=\"kv\">\u003cthead>\u003ctr>\u003cth class=\"\">\u003c/th>\u003cth class=\"num\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"\">placeholders among replacements\u003c/td>\u003ctd class=\"num\">0 of 3577\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">text characters outside replaced spans changed\u003c/td>\u003ctd class=\"num\">0 of 57729\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"\">cells of kept columns changed\u003c/td>\u003ctd class=\"num\">0 of 668\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"scope\">\u003cp>\u003cb>Measured:\u003c/b> replacements that are placeholders ([PERSON], ***, REDACTED) rather than values; characters of free text outside every replaced span, and cells of columns kept as they are (role keep or sex): how many changed\u003c/p>\u003cp>\u003cb>Not measured:\u003c/b> spans a detector replaced that were not personal data (a product named like a person): that needs gold labels\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003cp class=\"kicker\" style=\"margin-top:40px\">Blind spots\u003c/p>\u003ch2 style=\"margin-top:0\">Not measured\u003c/h2>\u003cp class=\"lead\">What these numbers cannot tell you.\u003c/p>\u003cul class=\"blind\">\u003cli>PII no detector found (rules + known). Without gold labels recall is unknown, and a value nobody found is neither replaced nor searched for. No model ran, so names in free text with no table entry, title or greeting are likely missed.\u003c/li>\u003cli>Quasi-identifiers in free text (job titles, employers, rare events) and in columns kept as they are.\u003c/li>\u003cli>Values shorter than 4 characters in the re-appearance scan (14 skipped).\u003c/li>\u003cli>Whether replacements fit their context, and downstream utility (Entity QA, fine-tune parity): `maskara bench`.\u003c/li>\u003cli>Linkage across releases: two outputs masked with different vault keys could be matched on what they kept; not simulated.\u003c/li>\u003c/ul>\u003c/div>"}</script>
<script nonce="">// maskara UI: renders a run bundle (maskara.bundle/1, see maskara/ui/bundle.py). No dependencies.
// Modes: "local" (served by `maskara ui` on 127.0.0.1, can run masking through /api/run) and
// "static" (the exported showroom: the bundle is inlined in the page, nothing is sent anywhere).
// Every value from the bundle goes into the DOM as text; only the report fragment, which maskara
// renders and escapes itself, is inserted as HTML.
(() => {
  "use strict";
  const CONFIG = JSON.parse(document.getElementById("maskara-config").textContent);
  const LOCAL = CONFIG.mode === "local";
  const REPO = "https://github.com/maskaradev/maskara";
  const INSTALL = "pip install git+" + REPO;
  const WAITLIST = "https://maskara.dev/#waitlist";
  const LIMIT = 100;
  const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12h21.5M1 10.75h5v2.5H1zM9 6.5v11M12 4.5v15M15 5v14M18 6.5v11M21 9v6"/></svg>';
  const GITHUB = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.64 7.64 0 0 1 8 3.87c.68 0 1.36.09 2 .26 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';
  const MOON = '<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M13.5 5.4A11 11 0 1 0 26.6 18.5 9 9 0 0 1 13.5 5.4Z"/></svg>';

  let B = null; // the bundle
  let D = null; // indexes over it
  const ui = { originals: true, limit: LIMIT, filter: "" };

  // -- helpers --------------------------------------------------------------------------------------

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "svg") el.innerHTML = v; // constant icons above
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  const key = (s, r, c) => s + "\u0000" + r + "\u0000" + c;
  const fmt = (v) => (v == null ? "" : typeof v === "string" ? v : JSON.stringify(v));
  const pct = (x, d = 1) => (x == null ? "n/a" : (100 * x).toFixed(d) + "%");
  const enc = encodeURIComponent;
  const initials = (name) => (name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const plural = (n, word) => `${n.toLocaleString("en-US")} ${word}${n === 1 ? "" : "s"}`;

  function index(bundle) {
    const fields = bundle.mentions.fields;
    const inputs = {};
    for (const inp of bundle.inputs) {
      inp.col = Object.fromEntries(inp.columns.map((c, j) => [c.name, j]));
      inputs[inp.name] = inp;
    }
    const cells = new Map();
    const mentions = bundle.mentions.rows.map((r, i) => {
      const m = { i };
      fields.forEach((f, j) => (m[f] = r[j]));
      const k = key(m.source, m.row, m.column);
      if (!cells.has(k)) cells.set(k, []);
      cells.get(k).push(m);
      return m;
    });
    const personas = Object.fromEntries(bundle.personas.map((p) => [p.id, p]));
    const d = { inputs, cells, mentions, personas };
    for (const m of mentions) {
      const after = fmt(cellOf(bundle, d, "after", m.source, m.row, m.column));
      m.replacement = m.start == null ? after : Array.from(after).slice(m.out_start, m.out_end).join("");
    }
    // Every free-text cell, for the text viewer.
    d.texts = [];
    for (const inp of bundle.inputs)
      for (const c of inp.columns.filter((c) => c.role === "text"))
        bundle.rows[inp.name].after.forEach((row, r) => {
          if (typeof row[inp.col[c.name]] === "string" && row[inp.col[c.name]].trim())
            d.texts.push({ source: inp.name, row: r, column: c.name, n: (cells.get(key(inp.name, r, c.name)) || []).length });
        });
    return d;
  }

  function cellOf(bundle, d, side, source, row, column) {
    const rows = bundle.rows[source][side];
    return rows ? rows[row][d.inputs[source].col[column]] : undefined;
  }
  const cell = (side, s, r, c) => cellOf(B, D, side, s, r, c);
  const showBefore = () => B.meta.originals && ui.originals;

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: Object.assign({ "X-Maskara-Token": CONFIG.token }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
    return data;
  }

  // -- highlighted text -----------------------------------------------------------------------------

  function marked(text, ms, side) {
    const cps = Array.from(fmt(text));
    const spans = ms.filter((m) => m.start != null)
      .map((m) => (side === "before" ? [m.start, m.end, m] : [m.out_start, m.out_end, m]))
      .sort((a, b) => a[0] - b[0]);
    const out = [];
    let pos = 0;
    for (const [a, b, m] of spans) {
      if (a < pos) continue;
      out.push(cps.slice(pos, a).join(""));
      out.push(h("mark", { class: `hl c-${m.category} ${side}${m.changed ? "" : " kept"}`, "data-m": m.i }, cps.slice(a, b).join("")));
      pos = b;
    }
    out.push(cps.slice(pos).join(""));
    return out;
  }

  function legend(ms) {
    const counts = {};
    for (const m of ms) counts[m.category] = (counts[m.category] || 0) + 1;
    return h("div", { class: "legend" },
      Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) =>
        h("span", { class: `dot c-${c}` }, c.toLowerCase(), h("b", {}, n))));
  }

  const tip = h("div", { class: "tip", hidden: true });
  function showTip(el, ev) {
    const m = D.mentions[+el.dataset.m];
    const p = m.persona && D.personas[m.persona];
    const rows = [
      ["detector", m.detector + (m.score < 1 ? ` (${m.score})` : "")],
      ["persona", p ? p.name : "no known person"],
      p && p.original && showBefore() ? ["original", p.original] : null,
      ["owner by", { row: "the row's subject", known: "a value in the tables", context: "the only person in the text", name: "the same name elsewhere", value: "nobody (keyed on the value)" }[m.link] || m.link],
      m.changed ? null : ["kept", "by the preset's policy"],
    ].filter(Boolean);
    tip.replaceChildren(h("b", { class: `dot c-${m.category}` }, `${m.category.toLowerCase()} · ${m.label}`),
      h("dl", {}, rows.map(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])));
    tip.hidden = false;
    const x = Math.min(ev.clientX + 14, window.innerWidth - 336);
    const y = ev.clientY + 18 + tip.offsetHeight > window.innerHeight ? ev.clientY - tip.offsetHeight - 12 : ev.clientY + 18;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  document.addEventListener("mouseover", (ev) => {
    const el = ev.target.closest && ev.target.closest("[data-m]");
    document.querySelectorAll(".hot").forEach((x) => x.classList.remove("hot"));
    if (!el || !D) return (tip.hidden = true);
    document.querySelectorAll(`[data-m="${el.dataset.m}"]`).forEach((x) => x.classList.add("hot"));
    showTip(el, ev);
  });

  // -- chrome ---------------------------------------------------------------------------------------

  function route() {
    const [view, ...rest] = location.hash.slice(1).split("/").map(decodeURIComponent);
    return { view: view || "overview", rest };
  }

  function topBar(view) {
    const tabs = [["overview", "Overview"], ["tables", "Tables"], ["texts", "Texts"], ["personas", "Personas"], ["report", "Report"]];
    if (LOCAL) tabs.push(["run", "Run"]);
    const theme = () => {
      const now = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const next = now === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("maskara-theme", next); } catch (e) { /* private mode */ }
    };
    return h("header", { class: "top" }, h("div", { class: "wrap" },
      h("a", { class: "brand", href: "#overview", svg: LOGO + "<b>maskara</b>" }),
      h("nav", { class: "tabs" }, tabs.map(([v, label]) =>
        h("a", { href: "#" + v, "aria-current": v === view ? "page" : null }, label))),
      h("div", { class: "top-end" },
        h("span", { class: "badge" }, h("i"), LOCAL ? "local · nothing leaves this machine" : "showroom · precomputed"),
        h("button", { class: "icon-btn", type: "button", "aria-label": "Toggle theme", svg: MOON, onclick: theme }))));
  }

  function copyCommand() {
    const btn = h("button", { type: "button" }, "Copy");
    btn.addEventListener("click", () => navigator.clipboard.writeText(INSTALL).then(() => {
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1500);
    }));
    return h("span", { class: "cmd" }, h("code", {}, h("b", {}, "$"), INSTALL), btn);
  }

  function banner() {
    if (LOCAL) return null;
    return h("div", { class: "banner" }, h("div", { class: "wrap" },
      h("span", {}, h("strong", {}, "Synthetic sample data"), " — run maskara locally on your own data. Nothing here was uploaded; every value on both sides is synthetic."),
      h("span", { class: "links" }, copyCommand(),
        h("a", { class: "btn btn-secondary", href: REPO, svg: GITHUB + "GitHub" }),
        h("a", { class: "btn btn-primary", href: WAITLIST }, "Join the waitlist"))));
  }

  function footer() {
    return h("footer", { class: "foot" },
      h("span", {}, `maskara ${B ? B.meta.maskara : ""} · Apache-2.0`),
      h("a", { href: REPO }, "GitHub"),
      LOCAL ? h("span", {}, "Served from 127.0.0.1; this page talks to nothing else.") : h("a", { href: "https://maskara.dev" }, "maskara.dev"));
  }

  function pageHead(kicker, title, sub, extra) {
    return h("div", { class: "page-hd" }, h("div", {}, h("p", { class: "kicker" }, kicker), h("h1", {}, title), sub ? h("p", { class: "sub" }, sub) : null), extra || null);
  }

  // -- views ----------------------------------------------------------------------------------------

  function overview() {
    const r = B.report, hd = r.headline;
    const rows = B.inputs.reduce((n, x) => n + x.rows, 0);
    const tiles = [
      [String(hd.originals_found), `of ${hd.originals_scanned}`, "known identifiers found in the output" + (hd.originals_partial ? ` · ${hd.originals_partial} partial to review` : ""), hd.originals_found ? "bad" : ""],
      [String(hd.broken_joins), `of ${hd.joins_checked}`, "joins broken that worked before", hd.broken_joins ? "bad" : ""],
      [pct(hd.date_gaps_exact, 0), "", `of ${hd.date_gaps_checked} per-person date gaps exact`, ""],
      [String(hd.personas), "", `personas for ${plural(hd.replaced, "replaced value")}`, ""],
    ];
    const featured = D.texts.slice(0, 60).reduce((best, t) => {
      const cats = new Set((D.cells.get(key(t.source, t.row, t.column)) || []).map((m) => m.category)).size;
      return !best || cats > best.cats ? Object.assign({ cats }, t) : best;
    }, null);
    return [
      pageHead(B.meta.synthetic ? "Sample run · synthetic data" : "Your run",
        B.meta.title || "Same people, new faces.",
        `${plural(rows, "row")} across ${plural(B.inputs.length, "input")}, masked with preset ${B.meta.preset} and detectors ${B.meta.detectors.join(" + ")}${B.meta.seed ? `, public seed "${B.meta.seed}"` : ""}. Every person became one persona in every table and text.`),
      B.meta.notices.map((n) => h("p", { class: "notice" }, n)),
      h("div", { class: "rp" }, h("div", { class: "tiles" }, tiles.map(([big, small, label, tone]) =>
        h("div", { class: "tile " + tone }, h("b", {}, big, h("small", {}, small)), h("span", {}, label))))),
      featured ? [h("h2", { class: "sec" }, "Before and after"), textPanes(featured, true)] : null,
      h("h2", { class: "sec" }, "Inputs"),
      h("div", { class: "inputs" }, B.inputs.map((inp) => {
        const replaced = D.mentions.filter((m) => m.source === inp.name && m.changed).length;
        const href = inp.kind === "table" ? `#tables/${enc(inp.name)}` : `#texts/${enc(inp.name)}`;
        return h("a", { class: "inp", href },
          h("h3", {}, inp.name, h("small", {}, inp.file || inp.kind)),
          h("p", {}, `${plural(inp.rows, inp.kind === "table" ? "row" : "text")} · ${plural(replaced, "value")} replaced`),
          h("div", { class: "chips" }, inp.columns.map((c) => roleChip(c, true))));
      })),
      h("h2", { class: "sec" }, "One persona everywhere"),
      h("div", { class: "people" }, B.personas.slice(0, 6).map(personaLink)),
    ];
  }

  function roleChip(c, withName) {
    return h("span", { class: "role" + (c.category && c.role !== "keep" ? ` c-${c.category}` : ""), title: withName ? c.role : null },
      withName ? `${c.name}` : c.role);
  }

  function personaLink(p) {
    const where = Object.entries(p.inputs).map(([k, n]) => `${k} ${n}`).join(" · ");
    return h("a", { class: "person-link", href: `#personas/${enc(p.id)}` }, h("div", { class: "who" },
      h("span", { class: "avatar" }, initials(p.name)),
      h("div", {}, h("b", {}, p.name), h("small", {}, where))));
  }

  function tables(name) {
    const list = B.inputs.filter((x) => x.kind === "table");
    if (!list.length) return [pageHead("Tables", "No tables in this run."), null];
    const inp = D.inputs[name] && D.inputs[name].kind === "table" ? D.inputs[name] : list[0];
    const before = showBefore();
    const rows = B.rows[inp.name].after;
    const shown = rows.slice(0, ui.limit);
    const ms = D.mentions.filter((m) => m.source === inp.name && m.start == null);
    return [
      pageHead("Tables", [inp.name, " ", h("span", {}, inp.file ? `· ${inp.file}` : "")],
        `${plural(inp.rows, "row")}. Column roles were inferred from headers and values${inp.subject ? `; rows belong to the person in ${inp.subject}` : ""}. Replaced cells are tinted by category${before ? ", with the original struck above" : ""}; hover one for its persona.`),
      h("nav", { class: "pills" }, list.map((x) => h("a", { href: `#tables/${enc(x.name)}`, "aria-current": x === inp ? "page" : null }, x.name, h("small", {}, x.rows)))),
      h("div", { class: "toolbar" }, originalsSwitch(), legend(ms)),
      h("div", { class: "scroll" }, h("table", { class: "grid" },
        h("thead", {}, h("tr", {}, h("th", { class: "n" }, "#"), inp.columns.map((c) =>
          h("th", {}, h("div", {}, c.name, roleChip(c, false)))))),
        h("tbody", {}, shown.map((row, r) => h("tr", {}, h("td", { class: "n" }, r + 1),
          inp.columns.map((c) => tableCell(inp, r, c, before))))))),
      rows.length > shown.length ? h("div", { class: "more" }, h("button", { class: "btn btn-secondary", type: "button", onclick: () => { ui.limit = Infinity; render(); } }, `Show all ${rows.length} rows`)) : null,
    ];
  }

  function originalsSwitch() {
    if (!B.meta.originals) return h("span", { class: "status" }, "originals not included in this bundle");
    const box = h("input", { type: "checkbox", checked: ui.originals, onchange: () => { ui.originals = box.checked; render(); } });
    return h("label", { class: "switch" }, box, B.meta.synthetic ? "Show originals (synthetic)" : "Show originals (local only)");
  }

  function tableCell(inp, r, c, before) {
    const after = cell("after", inp.name, r, c.name);
    const ms = D.cells.get(key(inp.name, r, c.name)) || [];
    if (c.role === "text") {
      const text = fmt(after);
      return h("td", { class: "txt" }, text ? h("a", { href: `#texts/${enc(inp.name)}/${r}/${enc(c.name)}` }, `open · ${ms.length}`) : null, text.slice(0, 90));
    }
    const m = ms.find((x) => x.start == null);
    if (!m) return h("td", {}, fmt(after));
    return h("td", { class: "rep", "data-m": m.i },
      before ? h("span", { class: "was" }, fmt(cell("before", inp.name, r, c.name))) : null,
      h("span", { class: `now c-${m.category}${m.changed ? "" : " kept"}` }, fmt(after)));
  }

  function textPanes(t, compact) {
    const ms = D.cells.get(key(t.source, t.row, t.column)) || [];
    const before = showBefore();
    const changed = ms.filter((m) => m.changed).length;
    const pane = (side, label) => h("div", { class: "pane " + side },
      h("div", { class: "pane-hd" }, h("b", {}, label), side === "after" ? h("span", { class: "state" }, `${changed} replaced`) : h("span", { class: "state" }, B.meta.synthetic ? "synthetic original" : "original · local only")),
      h("pre", { class: "prose" }, marked(cell(side, t.source, t.row, t.column), ms, side)));
    return [
      h("div", { class: "text-hd" }, h("h3", {}, `${t.source} · row ${t.row + 1}${t.column !== "text" ? ` · ${t.column}` : ""}`),
        compact ? h("a", { class: "status", href: `#texts/${enc(t.source)}/${t.row}/${enc(t.column)}` }, "open in Texts →") : null, legend(ms)),
      h("div", { class: "panes" + (before ? "" : " one") }, before ? pane("before", "before") : null, pane("after", "after")),
    ];
  }

  function texts(source, row, column) {
    if (!D.texts.length) return [pageHead("Texts", "No free text in this run.")];
    const t = D.texts.find((x) => x.source === source && x.row === +row && (column == null || x.column === column)) ||
      D.texts.find((x) => x.source === source) || D.texts[0];
    const ms = (D.cells.get(key(t.source, t.row, t.column)) || []).slice().sort((a, b) => a.start - b.start);
    const before = showBefore();
    const search = h("input", { type: "search", placeholder: "Filter texts…", value: ui.filter, "aria-label": "Filter texts" });
    const items = h("div", {});
    const fill = () => {
      const q = search.value.toLowerCase();
      ui.filter = search.value;
      items.replaceChildren(...D.texts.filter((x) => !q || fmt(cell("after", x.source, x.row, x.column)).toLowerCase().includes(q) || x.source.includes(q)).slice(0, 400).map((x) =>
        h("a", { href: `#texts/${enc(x.source)}/${x.row}/${enc(x.column)}`, "aria-current": x === t ? "page" : null },
          h("b", {}, `${x.source} #${x.row + 1}`, h("small", {}, x.n)),
          h("span", {}, fmt(cell("after", x.source, x.row, x.column)).replace(/\s+/g, " ").slice(0, 80)))));
    };
    search.addEventListener("input", fill);
    fill();
    return [
      pageHead("Texts", "Free text, span by span", `Each detected value is replaced in place; the rest of the text is untouched. Colors are categories; hover a value for its detector, persona and how its owner was found.`, originalsSwitch()),
      h("div", { class: "split" }, h("aside", { class: "list" }, search, items), h("div", {},
        textPanes(t, false),
        h("table", { class: "audit" }, h("thead", {}, h("tr", {}, ["value", "category", "detector", "persona", "owner by"].map((x) => h("th", {}, x)))),
          h("tbody", {}, ms.map((m) => {
            const p = m.persona && D.personas[m.persona];
            const orig = before ? Array.from(fmt(cell("before", m.source, m.row, m.column))).slice(m.start, m.end).join("") : null;
            return h("tr", { "data-m": m.i },
              h("td", {}, orig != null ? [h("s", {}, orig), " → "] : null, m.replacement),
              h("td", {}, h("span", { class: `role c-${m.category}` }, `${m.category.toLowerCase()} · ${m.label}`)),
              h("td", { class: "mono" }, m.detector),
              h("td", {}, p ? h("a", { href: `#personas/${enc(p.id)}` }, p.name) : h("span", { class: "status" }, "—")),
              h("td", { class: "mono" }, m.link));
          }))))),
    ];
  }

  function personas(id) {
    if (!B.personas.length) return [pageHead("Personas", "No personas in this run.")];
    const p = D.personas[id] || B.personas[0];
    const before = showBefore();
    const search = h("input", { type: "search", placeholder: "Filter personas…", "aria-label": "Filter personas" });
    const items = h("div", {});
    const fill = () => {
      const q = search.value.toLowerCase();
      items.replaceChildren(...B.personas.filter((x) => !q || x.name.toLowerCase().includes(q) || (before && x.original && x.original.toLowerCase().includes(q))).map((x) =>
        h("a", { href: `#personas/${enc(x.id)}`, "aria-current": x === p ? "page" : null },
          h("b", {}, x.name, h("small", {}, x.mentions)),
          h("span", {}, [x.sex, x.age, [x.city, x.state].filter(Boolean).join(", ")].filter((v) => v != null && v !== "").join(" · ")))));
    };
    search.addEventListener("input", fill);
    fill();
    const ms = D.mentions.filter((m) => m.persona === p.id);
    const facts = [["sex", p.sex], ["age", p.age], ["email", p.email], ["phone", p.phone], ["street", p.street],
      ["city", [p.city, p.state, p.zip].filter(Boolean).join(", ")], ["occupation", (p.occupation || "").replace(/_/g, " ")]];
    return [
      pageHead("Personas", "One person, one persona", "A persona is drawn once per person and reused in every table and text, so joins, histories and date gaps survive. Every field is synthetic."),
      h("div", { class: "split" }, h("aside", { class: "list" }, search, items), h("div", {},
        h("section", { class: "pcard" }, h("div", { class: "who" }, h("span", { class: "avatar big" }, initials(p.name)),
          h("div", {}, h("h2", {}, p.name), before && p.original ? h("span", { class: "was" }, "was ", h("s", {}, p.original)) : null)),
          h("dl", { class: "facts" }, facts.filter(([, v]) => v != null && v !== "").map(([k, v]) => h("div", {}, h("dt", {}, k), h("dd", {}, v)))),
          h("div", { class: "where" }, Object.entries(p.inputs).map(([k, n]) => h("span", { class: "role" }, `${k} · ${n}`)))),
        h("table", { class: "audit" }, h("thead", {}, h("tr", {}, ["where", "value", "category", "detector"].map((x) => h("th", {}, x)))),
          h("tbody", {}, ms.slice(0, 300).map((m) => {
            const isText = m.start != null;
            const href = isText ? `#texts/${enc(m.source)}/${m.row}/${enc(m.column)}` : `#tables/${enc(m.source)}`;
            const orig = before ? Array.from(fmt(cell("before", m.source, m.row, m.column))).slice(m.start ?? 0, m.end ?? undefined).join("") : null;
            return h("tr", { "data-m": m.i },
              h("td", { class: "mono" }, h("a", { href }, `${m.source}.${m.column} #${m.row + 1}`)),
              h("td", {}, orig != null ? [h("s", {}, orig), " → "] : null, m.replacement),
              h("td", {}, h("span", { class: `role c-${m.category}` }, `${m.category.toLowerCase()} · ${m.label}`)),
              h("td", { class: "mono" }, m.detector));
          }))),
        ms.length > 300 ? h("p", { class: "status" }, `first 300 of ${ms.length}`) : null)),
    ];
  }

  function report() {
    const body = h("div", {});
    body.innerHTML = B.report_html; // rendered and escaped by maskara.report.html
    return [pageHead("Report", "Privacy and fidelity, measured", "Computed during the run from the originals in memory; the report itself holds counts and locations, never original values. Each card says what it measured and what it could not."), body];
  }

  function runForm() {
    const rows = h("div", {});
    const addRow = (kind = "table", name = "", path = "", subject = "") => {
      const row = h("div", { class: "row" },
        h("select", { "aria-label": "kind" }, h("option", { value: "table", selected: kind === "table" }, "table"), h("option", { value: "text", selected: kind === "text" }, "texts")),
        h("input", { placeholder: "name", value: name, "aria-label": "input name" }),
        h("input", { placeholder: "/path/to/file.csv or .jsonl", value: path, "aria-label": "file path" }),
        h("input", { placeholder: "subject column", value: subject, "aria-label": "subject column" }),
        h("button", { class: "icon-btn", type: "button", "aria-label": "Remove", onclick: () => row.remove() }, "×"));
      rows.append(row);
    };
    addRow();
    const preset = h("select", {}, ["balanced", "strict", "max_utility"].map((p) => h("option", { value: p }, p)));
    const detector = h("select", {}, [["rules", "rules (no model)"], ["auto", "auto (GLiNER2 if installed)"], ["gliner2", "gliner2"], ["opf", "opf"]].map(([v, l]) => h("option", { value: v }, l)));
    const out = h("input", { placeholder: "optional: /path/to/output-dir" });
    const status = h("span", { class: "status" });
    const err = h("p", { class: "err" });
    const go = async (body, btn) => {
      btn.disabled = true;
      err.textContent = "";
      status.textContent = "masking… (originals stay in this process)";
      try {
        const res = await api("/api/run", body);
        B = res.bundle;
        D = index(B);
        ui.limit = LIMIT;
        status.textContent = res.written ? `wrote ${res.written.length} files` : "";
        location.hash = "#overview";
        render();
      } catch (e) {
        err.textContent = e.message;
        status.textContent = "";
      } finally {
        btn.disabled = false;
      }
    };
    const demoBtn = h("button", { class: "btn btn-primary", type: "button" }, "Mask the sample store data");
    demoBtn.addEventListener("click", () => go({ demo: true, preset: preset.value }, demoBtn));
    const runBtn = h("button", { class: "btn btn-primary", type: "button" }, "Run on these files");
    runBtn.addEventListener("click", () => {
      const body = { tables: {}, texts: {}, subjects: {}, preset: preset.value, detector: detector.value, out: out.value.trim() || null };
      for (const row of rows.children) {
        const [kind, name, path, subject] = [...row.querySelectorAll("select, input")].map((x) => x.value.trim());
        if (!path) continue;
        const n = name || path.split(/[\\/]/).pop().replace(/\.[^.]+$/, "");
        body[kind === "table" ? "tables" : "texts"][n] = path;
        if (subject) body.subjects[n] = subject;
      }
      go(body, runBtn);
    });
    return [
      pageHead("Run", "Mask data on this machine", "Paths are read by the maskara process on this computer. Nothing is uploaded: this page and its server only talk over 127.0.0.1, and the originals stay in memory."),
      h("div", { class: "form" },
        h("fieldset", {}, h("legend", {}, "Try it"), h("div", { class: "actions" }, demoBtn, h("span", { class: "status" }, "an online store: customers, agents, orders, tickets and notes (synthetic, bundled)"))),
        h("fieldset", {}, h("legend", {}, "Your files"), rows,
          h("button", { class: "btn btn-secondary", type: "button", onclick: () => addRow() }, "+ Add a file"),
          h("p", { class: "hint" }, "Tables: .csv or .jsonl. Texts: .txt or .jsonl (strings, or objects with a \"text\" field). The subject column holds the person's key; rows of different files with the same key are the same person.")),
        h("fieldset", {}, h("legend", {}, "Options"), h("div", { class: "opts" },
          h("label", {}, "Preset", preset), h("label", {}, "Detector", detector), h("label", {}, "Write masked files to", out)),
          h("p", { class: "hint" }, "Without an output directory nothing is written. Personas here use a fresh key per run; use `maskara mask --vault` for stable personas across runs.")),
        h("div", { class: "actions" }, runBtn, status), err),
    ];
  }

  function empty() {
    return h("div", { class: "empty" }, h("h2", {}, "No run yet"), h("p", {}, "Mask the bundled sample data or your own files to see the result here."),
      h("a", { class: "btn btn-primary", href: "#run" }, "Start a run"));
  }

  function render() {
    const { view, rest } = route();
    let body;
    if (view === "run" && LOCAL) body = runForm();
    else if (!B) body = [pageHead("maskara", "Same people, new faces."), empty()];
    else if (view === "tables") body = tables(rest[0]);
    else if (view === "texts") body = texts(rest[0], rest[1], rest[2]);
    else if (view === "personas") body = personas(rest[0]);
    else if (view === "report") body = report();
    else body = overview();
    tip.hidden = true;
    document.getElementById("app").replaceChildren(topBar(view), banner() || "", h("main", {}, h("div", { class: "wrap" }, body, footer())), tip);
  }

  let lastView = null;
  window.addEventListener("hashchange", () => {
    const view = route().view;
    if (view !== lastView) { ui.limit = LIMIT; window.scrollTo(0, 0); }
    lastView = view;
    render();
  });

  async function start() {
    try {
      const saved = localStorage.getItem("maskara-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) { /* private mode */ }
    if (LOCAL) {
      B = (await api("/api/bundle")).bundle;
    } else {
      B = JSON.parse(document.getElementById("maskara-bundle").textContent);
    }
    if (B) D = index(B);
    lastView = route().view;
    render();
  }
  start().catch((e) => {
    document.getElementById("app").replaceChildren(h("p", { class: "boot" }, "maskara could not start: " + e.message));
  });
})();
</script>
</body>
</html>
